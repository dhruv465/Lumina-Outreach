[project]
name = "lumina-livekit-agent"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "httpx~=0.27",
    "livekit-agents[anthropic,deepgram,google,openai,silero,turn-detector]~=1.5",
    "livekit-plugins-noise-cancellation~=0.2",
    "python-dotenv~=1.0",
]

[dependency-groups]
dev = [
    "pytest~=8.0",
    "pytest-asyncio~=0.24",
    "respx~=0.21",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
